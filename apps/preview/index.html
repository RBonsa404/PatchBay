<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PatchBay Aperçu</title>
  <style>
    /* Charte du Club Informatique de l'IST (docs/06-charte-club-ist.md) : sombre par défaut. */
    :root {
      --bg: #070D1E; --panel: rgba(15, 23, 42, 0.78); --ink: #F8FAFC; --muted: #94A3B8; --line: rgba(56, 189, 248, 0.18);
      --accent: #1D4ED8; --cyan: #38BDF8; --amber: #FBBF24; --up: #10B981; --down: #EF4444; --shut: #64748B;
      --term-bg: #050A17; --term-ink: #CBD5E1; --node: #162447;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg: #F8FAFC; --panel: rgba(255, 255, 255, 0.88); --ink: #0F172A; --muted: #64748B; --line: rgba(29, 78, 216, 0.15);
        --cyan: #0284C7; --amber: #D97706; --term-bg: #0F172A; --term-ink: #E2E8F0; --node: #EFF6FF;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 Inter, system-ui, "Segoe UI", sans-serif; }
    header { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
    header h1 { font: 600 18px Poppins, Inter, system-ui, sans-serif; margin: 0; } header h1 .brand { color: var(--cyan); }
    header .tag { color: var(--muted); font-size: 13px; }
    select, button, input { font: inherit; color: inherit; }
    select, .btn { padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); cursor: pointer; }
    main { display: grid; gap: 14px; padding: 14px 16px; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); max-width: 1400px; margin: 0 auto; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
    section { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; min-width: 0; backdrop-filter: blur(14px); box-shadow: 0 0 20px rgba(56, 189, 248, 0.08); }
    h2 { font-size: 14px; margin: 0 0 8px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
    #brief { margin: 0 0 10px; }
    svg { width: 100%; height: auto; display: block; }
    .link { stroke-width: 3; stroke-linecap: round; }
    .link.up { stroke: var(--up); } .link.down { stroke: var(--down); } .link.shut { stroke: var(--shut); stroke-dasharray: 6 5; }
    .port { font-size: 11px; fill: var(--muted); } .cable { font-size: 10px; fill: var(--muted); font-style: italic; }
    .node { cursor: pointer; } .node:focus { outline: none; }
    .box { fill: var(--node); stroke: var(--line); stroke-width: 1.5; }
    .box.rt { stroke: var(--cyan); } .box.sw { stroke: var(--amber); }
    .node.active .box { stroke-width: 3; filter: drop-shadow(0 0 6px var(--cyan)); }
    .name { font-weight: 700; font-size: 14px; fill: var(--ink); } .sub { font-size: 11px; fill: var(--muted); }
    .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 6px; flex-wrap: wrap; }
    .legend i { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin-right: 5px; border-radius: 2px; }
    #tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .tab { border: 1px solid var(--line); background: var(--panel); padding: 4px 12px; border-radius: 999px; cursor: pointer; }
    .tab.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    #screen { background: var(--term-bg); color: var(--term-ink); font: 13px/1.4 "JetBrains Mono", ui-monospace, Consolas, monospace; padding: 10px; border-radius: 8px 8px 0 0; height: 360px; overflow: auto; white-space: pre-wrap; margin: 0; }
    #form { display: flex; background: var(--term-bg); border-radius: 0 0 8px 8px; padding: 0 10px 10px; font: 13px ui-monospace, Consolas, monospace; color: var(--term-ink); }
    #prompt { white-space: pre; padding-right: 2px; }
    #cmd { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: inherit; font: inherit; }
    .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
    .row { display: grid; grid-template-columns: 110px 1fr; gap: 8px; align-items: center; margin-bottom: 8px; }
    .row input { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
    #h-out { white-space: pre-wrap; font: 13px ui-monospace, Consolas, monospace; background: var(--term-bg); color: var(--term-ink); padding: 10px; border-radius: 8px; min-height: 60px; margin-top: 8px; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  </style>
</head>
<body>
  <header>
    <h1><span class="brand">Patch</span>Bay <span class="tag">Club Informatique de l'IST · aperçu du moteur · M0 à M5</span></h1>
    <label>Scénario <select id="scenario"></select></label>
    <button class="btn" id="reset" type="button">Réinitialiser</button>
  </header>
  <main>
    <section>
      <h2>Scénario</h2>
      <p id="brief"></p>
      <svg id="topo" viewBox="0 0 640 330" role="img" aria-label="Topologie réseau"></svg>
      <div class="legend">
        <span><i style="background: var(--up)"></i>lien actif</span>
        <span><i style="background: var(--down)"></i>lien coupé (câble ou configuration)</span>
        <span><i style="background: var(--shut)"></i>interface désactivée</span>
      </div>
    </section>
    <section>
      <h2>Console</h2>
      <div id="tabs"></div>
      <div id="terminal">
        <pre id="screen" aria-live="polite"></pre>
        <form id="form" autocomplete="off"><span id="prompt"></span><input id="cmd" spellcheck="false" aria-label="Commande IOS" /></form>
        <div class="hint">Entrée exécute · ? aide · Tab complète · ↑/↓ historique · cliquez un équipement pour changer de console</div>
      </div>
      <div id="host" hidden>
        <h2 id="host-title"></h2>
        <div class="row"><label for="h-ip">Adresse IP</label><input id="h-ip" /></div>
        <div class="row"><label for="h-mask">Masque</label><input id="h-mask" /></div>
        <div class="row"><label for="h-gw">Passerelle</label><input id="h-gw" /></div>
        <button class="btn" id="apply" type="button">Appliquer</button>
        <div class="row" style="margin-top: 14px"><label for="h-dst">Ping vers</label><input id="h-dst" placeholder="172.16.1.10" /></div>
        <button class="btn primary" id="ping" type="button">Ping</button>
        <pre id="h-out"></pre>
      </div>
    </section>
  </main>
  <script type="module" src="dist/main.js"></script>
</body>
</html>

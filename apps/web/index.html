    <style>
      #boot { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; background: #070d1e; color: #edf1f7; font: 700 26px system-ui, sans-serif; letter-spacing: -0.01em; }
      #boot img { border-radius: 16px; }
      #boot i { display: block; width: 180px; height: 3px; overflow: hidden; background: #243044; }
      #boot i::after { content: ''; display: block; width: 40%; height: 100%; background: #fbbf24; animation: boot 1.1s ease-in-out infinite alternate; }
      @keyframes boot { from { transform: translateX(-20%); } to { transform: translateX(170%); } }
    </style>
